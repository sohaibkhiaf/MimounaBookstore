[project]
name = "ai-assistant"
version = "0.1.0"
description = "Mimouna Bookstore AI Assistant powered by FastAPI, OpenAI Agents SDK, and local Ollama (qwen3:4b-instruct)"
readme = "README.md"
authors = [
    { name = "Sohaib Khiaf", email = "sohaibkhiaf@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "openai-agents>=0.0.19",
    "openai>=1.68.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "ruff>=0.17.4",
]

[project.scripts]
ai-assistant = "main:main"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = [
    "BLE001",  # Blind exception catch (needed in tool handlers to prevent LLM agent crash)
    "E501",    # Line length (prompts and docstrings can exceed 120 chars)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
"main.py" = ["E402"]



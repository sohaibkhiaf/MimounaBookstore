services:
  # ============================================================================
  # 1. Database Service (MariaDB)
  # ============================================================================
  db:
    image: mariadb:10.11
    container_name: mimounabookstore_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: mimounabookstore_db
      MARIADB_USER: mimounabookstore_user
      MARIADB_PASSWORD: mimounabookstore_password
      MARIADB_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: mimounabookstore_db
      MYSQL_USER: mimounabookstore_user
      MYSQL_PASSWORD: mimounabookstore_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      # Automatically initialize the database with mimounabookstore_db.sql on first startup
      - ./mimounabookstore_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # Persist MariaDB data files across container restarts
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - mimounabookstore_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # ============================================================================
  # 2. Web Application Service (Laravel 11 - Docker Hub Image)
  # ============================================================================
  app:
    image: sohaibkhiaf/mimounabookstore-app:latest
    pull_policy: missing
    container_name: mimounabookstore_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: "Mimouna Bookstore"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "http://159.223.39.98:8000"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: mimounabookstore_db
      DB_USERNAME: mimounabookstore_user
      DB_PASSWORD: mimounabookstore_password
      AI_ASSISTANT_URL: "http://159.223.39.98:8642"
    ports:
      - "8000:8000"
    volumes:
      # Optional storage persistence for user-uploaded book covers
      - uploads_data:/var/www/html/public/uploads
    networks:
      - mimounabookstore_network

  # ============================================================================
  # 3. AI Assistant Microservice (FastAPI + OpenAI Agents SDK - Docker Hub Image)
  # ============================================================================
  ai_assistant:
    image: sohaibkhiaf/mimounabookstore-ai_assistant:latest
    pull_policy: missing
    container_name: mimounabookstore_ai_assistant
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    extra_hosts:
      # Resolves host.docker.internal seamlessly across Windows, macOS, and Linux
      - "host.docker.internal:host-gateway"
    environment:
      HOST: "0.0.0.0"
      PORT: "8642"
      # Connect to Ollama installed and running on the host machine
      OLLAMA_BASE_URL: "http://host.docker.internal:11434/v1"
      OLLAMA_API_KEY: "ollama"
      OLLAMA_MODEL: "qwen3:4b-instruct"
      OLLAMA_NUM_CTX: 16384
      # Connect to the Laravel application within the Docker network
      BOOKSTORE_API_BASE_URL: "http://app:8000/api"
      BOOKSTORE_API_TIMEOUT: 20.0
      AGENT_MAX_TURNS: 10
    ports:
      - "8642:8642"
    networks:
      - mimounabookstore_network

# ==============================================================================
# Shared Volumes & Custom Bridge Network
# ==============================================================================
volumes:
  db_data:
    driver: local
  uploads_data:
    driver: local

networks:
  mimounabookstore_network:
    driver: bridge
